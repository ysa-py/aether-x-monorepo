version: v2
managed:
  enabled: true
inputs:
  - directory: .
    paths:
      - aether/antiforgery/v1/antiforgery.proto
      - aether/supervisor/v1/supervisor.proto
plugins:
  # Go stubs go INSIDE the control-plane Go module so they resolve as
  # github.com/aether-x/control-plane/api/gen/go/... imports. (Run from api/proto,
  # so ../../control-plane is the monorepo's control-plane dir.)
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: ../../control-plane/api/gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.4.0
    out: ../../control-plane/api/gen/go
    opt:
      - paths=source_relative
# Rust stubs are NOT generated by buf: the Rust data plane builds them from the
# same protos at compile time via tonic_build (see core-supervisor/build.rs), so
# there is exactly one source of truth and no risk of drift.
