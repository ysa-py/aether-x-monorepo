[package]
name = "aether-core-supervisor"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Aether-X data plane: multi-core proxy Core Supervisor"
license = "Proprietary"
publish = false

[[bin]]
name = "aether-supervisor"
path = "src/main.rs"

[lib]
name = "aether_supervisor"
path = "src/lib.rs"

[dependencies]
aether-routing = { path = "../routing" }
# Async runtime
tokio = { version = "1.39", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# gRPC + protobuf (generated via tonic_build in build.rs)
tonic = { version = "0.12", features = ["tls", "tls-roots", "transport"] }
prost = "0.13"
# gRPC reflection is intentionally NOT enabled in prod; see SECURITY.md.
# Collections / state
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Errors
thiserror = "1"
anyhow = "1"
# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# IDs / time
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Async utilities
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
# Cryptography (reuses antiforgery's Ed25519 key material)
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"

[build-dependencies]
tonic-build = "0.12"

[features]
default = []
# Enable real subprocess adapters (xray/sing-box) instead of the in-process
# MockCore. Off by default so the crate builds without the binaries present.
real_cores = []

[dev-dependencies]
tokio = { version = "1.39", features = ["full", "test-util"] }
tempfile = "3"
proptest = "1"
