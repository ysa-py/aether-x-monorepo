[package]
name = "aether-antiforgery"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Aether-X anti-forgery core: signed subscription tokens, tamper-evident audit log, replay protection"
license = "Proprietary"
publish = false

[lib]
name = "aether_antiforgery"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"

[dev-dependencies]
proptest = "1"
