[package]
name = "aether-antiforgery"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Aether-X anti-forgery core: signed subscription tokens, tamper-evident audit log, replay protection"
license = "Proprietary"
publish = false

[lib]
name = "aether_antiforgery"
path = "src/lib.rs"

[dependencies]
# Identity/signature implementation for v4.public PASETO subscription tokens.
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
# PASETO v4.local implementation. Pin exactly so a change to the upstream
# token implementation is deliberate and re-runs the official vector corpus.
pasetors = { version = "=0.8.0", default-features = false, features = ["v4"] }
# Explicitly direct: secret buffers loaded from deployment configuration are
# zeroized after the signing key copies them.
zeroize = "1.8"
subtle = "2.6"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"

[dev-dependencies]
proptest = "1"
