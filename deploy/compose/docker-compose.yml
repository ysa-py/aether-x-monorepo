# Local development data layer. NOT for production — single replica, dev
# passwords. Brings up the Postgres/ClickHouse/Redis trio the control plane
# and AI pipeline depend on.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aether
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    # Optimal memory limits for a telemetry leaf node.
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      CLICKHOUSE_USER: aether
      CLICKHOUSE_PASSWORD: aether
      CLICKHOUSE_DB: aether
      # Production tuning: bound memory per query, prefer async merges.
      MAX_MEMORY_USAGE: "8000000000"
      MAX_BYTES_BEFORE_EXTERNAL_GROUP_BY: "2000000000"
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - chdata:/var/lib/clickhouse
      # The control plane also runs EnsureSchema() at startup; this init SQL is a
      # belt-and-suspenders default for self-hosted single-node dev.
      - ../examples/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  chdata:
